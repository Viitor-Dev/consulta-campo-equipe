(function(){
const payload=JSON.parse(document.getElementById('vault-data').textContent);
const enc=new TextEncoder(),dec=new TextDecoder();

const to64=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s)};
let offline=Promise.resolve('Consulta offline não confirmada. Mantenha internet para reabrir.');
